# ==========================================================
# Phase 6 / Chunk 5 — the whole stack: Redis broker + API + Celery worker.
#   docker compose up --build
# The API enqueues scans onto Redis; the worker (separate container) runs them
# and writes progress/result to the SQLite scan store on a SHARED volume that
# the API reads back via GET /scan/{id}. See DEPLOYMENT.md for the run + verify
# checklist and the known caveats (single worker, SQLite-on-volume, image size).
# ==========================================================

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SCAN_DB_PATH: /data/scan_states.db
      # Phase A security controls. All read from the host env (or a .env file
      # beside this compose file) so no secret is committed; each falls back to
      # the app default when unset — which for API_KEY means an OPEN API, fine
      # for a local `compose up`, not for anything internet-facing.
      API_KEY: ${API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ALLOWED_GIT_HOSTS: ${ALLOWED_GIT_HOSTS:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-}
      # Unset -> the rate-limit window stays in this process, which is exactly
      # as accurate on one container and N times too generous across N. Set it
      # to share the window (redis://redis:6379/2 — its own database; 0 and 1
      # belong to Celery). The prod overlay declares no environment block of
      # its own for api, so this line serves both compose paths.
      REDIS_URL: ${REDIS_URL:-}
    volumes:
      - scan-data:/data
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Prefork (billiard) pool: the per-file analysis map spawns child processes,
    # which stdlib multiprocessing forbids under a daemonic prefork worker —
    # billiard (bundled with Celery) is what makes that legal. Single worker
    # service by design; see DEPLOYMENT.md before scaling to replicas.
    command: celery -A backend.app.services.celery_app:celery_app worker --loglevel=info --concurrency=2
    # No API_KEY / ALLOWED_ORIGINS / RATE_LIMIT_PER_MINUTE here on purpose: the
    # worker serves no HTTP surface, so those controls have nothing to guard.
    # URL validation happens at the API boundary before a job is ever enqueued.
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SCAN_DB_PATH: /data/scan_states.db
    volumes:
      - scan-data:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  scan-data:
