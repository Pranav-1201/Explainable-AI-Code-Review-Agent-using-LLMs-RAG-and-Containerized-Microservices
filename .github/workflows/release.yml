# ==========================================================
# Container image publish to GHCR (Phase B).
# ==========================================================
#
# One image serves BOTH the api and worker services — same code, the compose
# service picks the command (see backend/Dockerfile and docker-compose.yml).
#
# A SECOND image carries the web tier (frontend/Dockerfile: the built React
# bundle served by Caddy). Both are tagged with the same commit sha on the
# same run, because the bundle and the API are versioned together and can
# disagree about request shapes — rolling back only one would not be a
# rollback.
#
# Deliberately a SEPARATE workflow from ci.yml, gated on CI succeeding: a
# published image that never passed the tests is worse than no image, because
# the tag implies it did. `workflow_run` is what enforces that ordering.
#
# Tagging strategy, which is also the rollback story: every build is tagged with
# the immutable commit SHA, and `latest` is moved on top of it. Rolling back is
# then re-deploying an explicit sha tag rather than hoping a rebuild reproduces
# the previous state. See DEPLOYMENT.md.

name: Publish image

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only publish when the CI run that triggered this actually passed.
    # workflow_run fires on failure too, so without this a red build would ship.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the exact commit CI validated, not whatever main points
          # at now — they differ if another push landed in the meantime.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image name
        # GHCR rejects uppercase in image paths and this repository's owner has
        # capitals, so ${{ github.repository }} cannot be used raw.
        id: img
        run: |
          base="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=$base" >> "$GITHUB_OUTPUT"
          echo "web=$base-web" >> "$GITHUB_OUTPUT"

      - name: Resolve commit SHA
        id: sha
        run: echo "value=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        # arm64 images for the free Oracle A1 host (Phase M). Emulation is paid
        # only where the cache misses: cache-from below reads the NATIVE arm64
        # layers ci.yml's deploy-stack matrix built for this same commit, and
        # the web image's npm/Vite stage runs on the build platform regardless.
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Automatically provided; no secret to manage.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.sha.outputs.value }}
            ${{ steps.img.outputs.name }}:latest
          platforms: linux/amd64,linux/arm64
          # Read the native per-architecture caches ci.yml's deploy-stack wrote
          # for this commit (CI always completes before this workflow runs).
          # No cache-to: CI owns those scopes, and a third copy here would only
          # push them out of the repository's cache quota sooner.
          cache-from: |
            type=gha,scope=api-X64
            type=gha,scope=api-ARM64

      - name: Build and push the web image
        # The frontend bundle and the API are versioned together and can
        # disagree about request shapes, so a sha-tagged rollback covering
        # only the API would not be a rollback.
        #
        # Context is the repo root, not frontend/, because the Caddyfile lives
        # beside docker-compose.yml. Same convention as backend/Dockerfile.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.web }}:${{ steps.sha.outputs.value }}
            ${{ steps.img.outputs.web }}:latest
          build-args: |
            VITE_API_BASE=/api
            VITE_SITE_URL=${{ vars.SITE_URL }}
          # VITE_SITE_URL comes from a repository VARIABLE, not a secret: it is
          # the public address of the site. Unset renders as empty, which is the
          # correct state until a domain exists — canonical links, og:url and
          # sitemap.xml all omit themselves rather than pointing somewhere wrong.
          #
          # VITE_API_KEY is deliberately absent, and frontend/Dockerfile no
          # longer accepts it: a published image is public, so a key baked in
          # would be a published key. The browser gets the key at runtime from
          # /config.js, rendered from the host's API_KEY (D36).
          platforms: linux/amd64,linux/arm64
          cache-from: |
            type=gha,scope=web-X64
            type=gha,scope=web-ARM64
