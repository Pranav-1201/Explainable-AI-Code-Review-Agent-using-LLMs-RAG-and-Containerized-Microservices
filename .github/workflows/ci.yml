# ==========================================================
# CI — the gate that has to be green before anything deploys (Phase B).
# ==========================================================
#
# The July audit scored deployment readiness 3/10, and "no CI at all" was the
# single biggest reason: every quality claim rested on someone remembering to
# run the suite locally on Windows. This runs the same checks on Linux, on every
# push and PR.
#
# The checks mirror exactly what is run by hand before a commit:
#   pytest                          backend suite
#   run_benchmark.py --gate         detector precision/recall regression gate
#   tsc -b                          frontend typecheck
#   vite build                      frontend production build
#   vitest run                      frontend unit tests
#   playwright test                 end-to-end smoke + 375/768 viewport gate
#   docker compose up               both images build and the whole stack boots
#
# Backend, frontend, and deploy-stack are separate jobs so they run in parallel
# and a break in one is legible at a glance. deploy-stack is the newest and the
# one worth explaining: the development machine has no Docker, so before it the
# compose stack had never actually been run anywhere. It builds both images,
# boots everything, and drives the edge through Caddy, which turns "it deploys"
# from a claim into a gate.

name: CI

on:
  push:
    # Branch families, not a catch-all. A branch outside this list gets NO CI
    # run at all and the omission is silent — the push simply succeeds — so a
    # new family has to be added here the first time it is used.
    branches: ["main", "phase-*/**", "prelaunch/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# A new push to the same branch makes the in-flight run obsolete. Cancel it
# rather than paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest + detector gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # S10. The rate limiter's Redis backend is the one part of this repo that
      # cannot be verified on the development machine — it has no Docker, no
      # redis-server and no WSL distribution — so the runner is where that
      # claim gets tested. A fake with partial Lua support was rejected: the
      # property under test is that the check and the spend are atomic INSIDE
      # Redis, which only a real server demonstrates.
      #
      # Matches the tag the compose stack runs, so the Lua script is exercised
      # against the same engine production uses.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the Dockerfile base image (python:3.11-slim) and the
          # interpreter the suite is developed against.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install pinned dependencies
        # requirements.lock, not requirements.txt: the loose file would let a
        # transitive release turn a green commit red with no code change. The
        # lock carries its own --extra-index-url for the CPU torch wheel.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run test suite
        # No env is set on purpose. Every optional integration is OFF by
        # default (ENABLE_ANTHROPIC, ENABLE_CODEBERT), API_KEY is unset so the
        # auth tests exercise the open-API path, and CELERY_BROKER_URL is unset
        # so Celery runs eagerly in-process — no Redis service needed.
        run: python -m pytest -q

      - name: Redis-backed rate limiter
        # A SEPARATE step, deliberately. The run above sets no env so that every
        # optional integration is exercised in its off state, and that includes
        # the rate limiter's in-process path. This step is the only place
        # REDIS_URL is set, so the two stores are both covered rather than one
        # silently replacing the other.
        #
        # test_rate_limit_redis.py SKIPS ITSELF when REDIS_URL is unset, and an
        # all-skipped run exits 0. So the exit code alone cannot distinguish
        # "the Redis limiter works" from "nothing ran" — the second is what you
        # get the day this env block is edited away. The grep asserts a nonzero
        # passed count, turning a silently empty run into a red build.
        shell: bash
        env:
          # db 15, not 0: the compose stack uses 0 and 1 for the Celery broker
          # and result backend. Nothing shares this database with real data.
          REDIS_URL: redis://localhost:6379/15
        run: |
          set -o pipefail
          python -m pytest backend/tests/test_rate_limit_redis.py -q | tee "$RUNNER_TEMP/redis-tests.log"
          grep -qE '[0-9]+ passed' "$RUNNER_TEMP/redis-tests.log" || {
            echo "::error::Redis limiter tests did not run — REDIS_URL missing or all tests skipped"
            exit 1
          }

      - name: Detector regression gate
        # Exits non-zero if any finding type regresses below its recorded
        # precision/recall floor. The real-repo arm of this script is
        # report-only and never affects the exit code.
        run: python backend/benchmark/run_benchmark.py --gate

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # `ci` not `install`: installs exactly the lockfile and fails if
        # package.json and package-lock.json have drifted apart.
        run: npm ci

      - name: Typecheck
        # `tsc -b`, not `tsc --noEmit`: the root tsconfig.json is solution-style
        # ("files": [] plus project references), so a plain invocation compiles
        # zero files and exits 0 no matter what is broken. `vite build` does not
        # typecheck either, so this step was the only type gate and it was
        # passing vacuously. -b walks the referenced projects for real.
        run: npx tsc -b

      - name: Production build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Install Playwright browser
        # Only chromium. The suite targets one engine across three viewports,
        # so downloading firefox and webkit would cost time and prove nothing.
        #
        # No --with-deps. That flag runs apt-get update && apt-get install for
        # Chromium's system libraries, which the ubuntu-latest runner image
        # already ships. It bought nothing and cost everything: on 2026-08-19 it
        # hung twice in a row against the Ubuntu mirrors — once 5 minutes on a
        # single font package, once 14 minutes on `noble-security InRelease` —
        # and burned the 15-minute job timeout before a single test ran. If a
        # library ever genuinely goes missing, chromium fails to launch with a
        # named error, which is a far better failure than a silent stall.
        run: npx playwright install chromium

      - name: End-to-end and mobile viewport tests
        # playwright.config.ts starts its own `vite preview` against the
        # production build, so there is no separate serve step here. Every
        # backend call is intercepted in the specs, so this needs no Python
        # and no Redis.
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  deploy-stack:
    name: Deploy stack (build images + boot)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # This job exists because the development machine has no Docker, so until
    # now nothing in this repository had ever built the images or started the
    # stack — the compose file was authored, reviewed, and shipped unexecuted
    # from Phase B onward. The GitHub runner does have Docker, so the claim
    # can simply be tested instead of deferred to whoever deploys.

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: local/acra:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the web image
        # Context is the repo root, not frontend/, because the Caddyfile lives
        # beside docker-compose.yml. Same convention as backend/Dockerfile.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: local/acra-web:ci
          build-args: |
            VITE_API_BASE=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate the merged compose configuration
        # Renders the base file and the overlay together, resolving variables
        # and every !reset. A far stronger check than parsing the overlay
        # alone, and it catches the realistic failure: an overlay that is
        # valid YAML but does not merge.
        env:
          IMAGE_REPO: local/acra
          WEB_IMAGE_REPO: local/acra-web
          IMAGE_TAG: ci
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config

      - name: Validate the Caddyfile
        # Caddy only reports a bad config when it starts, where it surfaces as
        # the edge never coming up and a 90-second timeout. Adapting the config
        # explicitly turns that into an immediate, named error.
        run: |
          docker run --rm --entrypoint caddy local/acra-web:ci \
            validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Boot the stack
        env:
          IMAGE_REPO: local/acra
          WEB_IMAGE_REPO: local/acra-web
          IMAGE_TAG: ci
          # Deliberately the EMPTY STRING, not merely unset. There is no DNS
          # name here and no way to complete an ACME challenge, so the stack
          # has to come up on :80 — but empty is also the case that broke the
          # first run of this job: Caddy substitutes a set-but-empty variable
          # as empty, the site-address line collapsed to a bare "{", and Caddy
          # read the whole site block as global options. Keeping it empty
          # here is the regression test for that.
          SITE_ADDRESS: ""
          BACKUP_HOST_DIR: ./ci-backups
          # Short enough that the smoke test can observe a snapshot actually
          # being written, rather than only that the container started.
          BACKUP_INTERVAL_SECONDS: "10"
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
          docker compose -f docker-compose.yml -f docker-compose.prod.yml ps

      - name: Smoke test through the proxy
        run: |
          set -euo pipefail

          # Wait for the edge rather than sleeping a fixed amount. `web`
          # depends on the api healthcheck, so this also proves the
          # healthcheck itself works.
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://localhost/api/health; then
              echo "edge is up after ${i}s"
              break
            fi
            if [ "$i" = "90" ]; then
              echo "edge never came up" >&2
              exit 1
            fi
            sleep 1
          done

          echo "--- GET /api/health (proxied, prefix stripped) ---"
          curl -fsS http://localhost/api/health | tee /tmp/health.json
          echo

          # The prefix strip is the subtle part of the Caddyfile, so assert it
          # rather than assume it: the backend serves /health, and it is only
          # reachable at /api/health if handle_path removed the prefix.
          grep -q '"status"' /tmp/health.json

          echo "--- GET / (SPA shell) ---"
          curl -fsS http://localhost/ | head -c 400
          echo

          # A real client-side route has no file on disk and must still return
          # the shell, so a refresh or a shared link works.
          echo "--- GET /history (client-side route) ---"
          code=$(curl -fsS -o /dev/null -w '%{http_code}' http://localhost/history)
          test "$code" = "200" || { echo "FAIL: /history should serve the SPA shell, got $code" >&2; exit 1; }
          echo "$code"

          # This assertion used to expect 200 and deliberately now expects 404.
          # The @spa matcher is exact, not a prefix: /history is a route and
          # /history/deep-link is not. Serving the shell for it is what made
          # every mistyped URL an indexable duplicate.
          echo "--- GET /history/deep-link (NOT a route) ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/history/deep-link)
          test "$code" = "404" || { echo "FAIL: an unknown sub-path should 404, got $code" >&2; exit 1; }
          echo "$code"

          echo "--- GET /nonsense (unknown path) ---"
          code=$(curl -s -o /tmp/notfound.html -w '%{http_code}' http://localhost/nonsense)
          test "$code" = "404" || { echo "FAIL: unknown paths must return 404, got $code" >&2; exit 1; }

          # The body must be the application shell, not Caddy's plain-text
          # "404 page not found". This is what catches a missing
          # `status {err.status_code}` or a missing 404.html: the status alone
          # cannot tell those apart from a correct response.
          grep -q 'id="root"' /tmp/notfound.html             || { echo "FAIL: the 404 body is not the app shell; handle_errors or 404.html is wrong" >&2; cat /tmp/notfound.html >&2; exit 1; }
          echo "404 serves the app shell"

          # Static assets must survive the routing change. An over-eager @spa
          # matcher would hand the shell to a .js request and the app would
          # fail to boot with a MIME-type error.
          echo "--- GET the entry chunk ---"
          asset=$(grep -o '/assets/[^"]*\.js' /tmp/notfound.html | head -1)
          test -n "$asset" || { echo "FAIL: no asset URL found in the shell" >&2; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost$asset")
          test "$code" = "200" || { echo "FAIL: $asset returned $code" >&2; exit 1; }
          echo "$asset -> $code"

          echo "--- GET /favicon.svg ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/favicon.svg)
          test "$code" = "200" || { echo "FAIL: favicon.svg returned $code" >&2; exit 1; }
          echo "$code"

          # Security headers. Asserted as PRESENT — a header check cannot prove
          # the CSP does not break a chart or a popover, and DEPLOYMENT.md says
          # so plainly rather than implying more coverage than exists.
          echo "--- security headers ---"
          curl -sSI http://localhost/ | tee /tmp/headers.txt
          for header in "content-security-policy" "x-content-type-options" "referrer-policy" "strict-transport-security"; do
            grep -qi "^$header:" /tmp/headers.txt               || { echo "FAIL: missing response header $header" >&2; exit 1; }
          done
          echo "all security headers present"

      - name: Confirm the API port is NOT published
        # The overlay resets it. If this regresses, an unauthenticated API is
        # exposed beside the proxy instead of behind it, which is the worst
        # outcome available in this stack.
        run: |
          if curl -fsS -o /dev/null --max-time 5 http://localhost:8000/health; then
            echo "FAIL: the API answered on :8000; the overlay's port reset regressed" >&2
            exit 1
          fi
          echo "OK: :8000 is not published"

      - name: Confirm a backup snapshot is actually written
        # Not just that the service started. The store mounts read-only into
        # the backup container, and SQLite readers of a WAL database need the
        # -shm sidecar, so "can this even take a snapshot" is a real question
        # that only a running stack can answer. Creating the store here is
        # necessary because it is otherwise created lazily on the first scan.
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T api \
            python -c "import sqlite3; c=sqlite3.connect('/data/scan_states.db'); c.execute('pragma journal_mode=WAL'); c.execute('create table if not exists ci_probe(x)'); c.commit()"

          for i in $(seq 1 45); do
            if ls ./ci-backups/scan-*.db >/dev/null 2>&1; then
              echo "snapshot written after ${i}s:"
              ls -l ./ci-backups/
              exit 0
            fi
            sleep 1
          done

          echo "no snapshot was written; backup service logs follow" >&2
          docker compose -f docker-compose.yml -f docker-compose.prod.yml logs backup >&2
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v
